name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Code Quality & Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          pip install --upgrade pip
          pip install ruff mypy

      - name: Run Ruff (Linter & Formatter)
        run: |
          ruff check .
          ruff format --check .

  integration-tests:
    name: Ingestion & Lakehouse Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      s3:
        image: scality/s3server:latest
        ports:
          - 8000:8000
        env:
          SCALITY_ACCESS_KEY_ID: minioadmin
          SCALITY_SECRET_ACCESS_KEY: minioadminpassword

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Project Dependencies
        run: |
          pip install --upgrade pip
          pip install boto3 httpx duckdb deltalake pandas pyarrow pytest pytest-mock

      - name: Wait for S3 Emulator to bind
        run: |
          timeout 30 bash -c 'until nc -z localhost 8000; do sleep 1; done'

      - name: Initialize Lakehouse Buckets
        run: |
          python init_s3.py

      - name: Run Integration Tests
        env:
          S3_ENDPOINT: http://localhost:8000
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadminpassword
        run: |
          pytest tests/
